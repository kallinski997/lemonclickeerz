<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Lemon Clicker WebApp</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Lemon Clicker 🍋</h1>
  <div id="telegram-user"></div>
  <div id="game">
    <img id="main-object" src="https://cdn-icons-png.flaticon.com/512/3083/3083293.png" alt="Lemon" />
    <div id="lemon-count">0 Zitronen</div>
    <div id="premium-count">Premium: <span id="premium">0</span></div>
    <button id="shop-btn">Shop 💎</button>
    <div id="shop-popup" style="display:none;"></div>
    <button id="upgrade-btn">Klick-Upgrade</button>
  </div>
  <script src="game.js"></script>
  <script src="telegram.js"></script>
  <script src="shop.js"></script>
</body>
</html>
